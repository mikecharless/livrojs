<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa Cinema JS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Cine JS: Filmes em Cartaz</h1>

    <form>
        <p>
            Título do filme:
            <input type="text" id="inNome" required autofocus>
        </p>
        <p>
            Duração:
            <input type="number" id="inTempo" required>
        </p>
        <p>
            <input type="submit" value="Converter em Horas e Minutos" id="button">
        </p>
    </form>

    <pre id="outResp1"></pre>
    <pre id="outResp2"></pre>

    <script src="js/ex2_2.js"></script>
</body>
</html>
