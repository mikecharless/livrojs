<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa Revenda de Veículos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Revenda de Veículos JS</h1>

    <form>
        <p>
            Veículo:
            <input type="text" id="inVeiculo" required autofocus>
        </p>
        <p>
            Preço R$: 
            <input type="number" id="inPreco" required>
        </p>
        <p>
            <input type="submit" value="Ver Promoção" id="button">
        </p>
    </form>

    <pre id="outResp1"></pre>
    <pre id="outResp2"></pre>
    <pre id="outResp3"></pre>

    <script src="js/ex2_3.js"></script>
</body>
</html>
