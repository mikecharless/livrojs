<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermercado JS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Supermercado JS</h1>
    <form>
        <p>
            <label for="inProduto">Produto: </label>
            <input type="text" id="inProduto" required autofocus>
        </p>
        <p>
            <label for="inPreco">Preço R$: </label>
            <input type="number" id="inPreco" required step="0.01">
        </p>
        <p>
            <input type="submit" value="Ver Promoção" id="button">
        </p>
    </form>

    <pre id="outResp1"></pre>
    <pre id="outResp2"></pre>

    <script src="js/resp2_c.js"></script>
</body>
</html>
