<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmácia JS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Farmácia JS</h1>
    <form>
        <p>
            Medicamento:
            <input type="text" id="inMedicamento" required autofocus>
        </p>
        <p>
            Preço R$: 
            <input type="number" id="inPreco" required step="0.01">
        </p>
        <p>
            <input type="submit" value="Mostrar Promoção" id="button">
        </p>
    </form>

    <pre id="outResp1"></pre>
    <pre id="outResp2"></pre>

    <script src="js/resp2_a.js"></script>
</body>
</html>
