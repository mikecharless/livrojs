<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repete Fruta</title>
    <link rel="stylesheet" href="css/styles2.css">
</head>
<body>
    <div>
        <header>
            <img src="img/frutas.jpeg" alt="frutas">
            <h1>Programa Repete Fruta</h1>
        </header>
        <main>
            <form>
                <p>
                    <label for="inFruta">Fruta:</label>
                    <input type="text" id="inFruta" required autofocus>
                </p>
                <p>
                    <label for="inNumero">Número:</label>
                    <input type="number" id="inNumero" required min="0">
                </p>
                <p>
                    <input type="submit" value="Repetir Fruta" id="buttom">
                </p>
            </form>
            
            <p id="paragResp"></p>
        </main>
    </div>

    <script src="js/resp5_a.js"></script>
</body>
</html>
