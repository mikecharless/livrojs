<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinchilas</title>
    <link rel="stylesheet" href="css/styles2.css">
</head>
<body>
    <div>
        <header>
            <img src="img/chinchila.jpeg" alt="chinchila">
            <h1>Programa Criação de Chinchilas</h1>
        </header>
        <main>
            <form>
                <p>
                    <label for="inNumero">N° chinchilas</label>
                    <input type="number" id="inNumero" required autofocus min="1">
                </p>
                <p>
                    <label for="inAnos">N° Anos:</label>
                    <input type="number" id="inAnos" required min="1">
                </p>
                <p>
                    <input type="submit" value="Mostrar Previsão de chinchilas" id="buttom">
                </p>
            </form>

            <pre></pre>
        </main>
    </div>

    <script src="js/resp5_b.js"></script>
</body>
</html>
