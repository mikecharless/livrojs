<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peso ideal</title>
    <link rel="stylesheet" href="css/style2.css">
</head>
<body>
    <header>
        <img src="img/balanca.webp" alt="Balança digital">
        <h1>Programa Peso ideal</h1>
    </header>
    <main>
        <form>
            <p>
                Nome:
                <input type="text" id="inNome" required autofocus>
            </p>
            <p>
                Sexo:
                <input type="radio" name="sexo" id="inMasculino" required > Masculino
                <input type="radio" name="sexo" id="inFeminino" required> Feminino
            </p>
            <p>
                Altura:
                <input type="number" id="inAltura" required min="0" step="0.01">
            </p>
            <p>
                <input type="submit" value="Calcular Peso Ideal">
                <input type="reset" value="Limpar Dados">
            </p>
        </form>

        <pre></pre>
    </main>

    <script src="js/ex4_2.js"></script>
</body>
</html>
