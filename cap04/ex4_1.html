<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa Situação do Aluno</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Programa Situação do aluno</h1>
    </header>
    <main>
        <form>
            <p>
                Nome do aluno:
                <input type="text" id="inNome" required autofocus>
            </p>
            <p>
                1° Nota:
                <input type="number" id="inNota1" required step="0.1">
            </p>
            <p>
                2° Nota:
                <input type="number" id="inNota2" required step="0.1">
            </p>
            <p>
                <input type="submit" value="Exibir média e situação do aluno" id="button">
            </p>
        </form>

        <pre id="outMedia"></pre>
        <pre id="outSituacao"></pre>
    </main>

    <script src="js/ex4_1.js"></script>
</body>
</html>
