<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style2.css">
</head>
<body>
    <img src="img/balanca.webp" alt="balança">
    <h1>Programa IMC</h1>

    <form>
        <p>
            Nome:
            <input type="text" id="inNome" required autofocus>
        </p>
        <p>
            Sexo:
            <input type="radio" name="sexo" id="inMasculino" required> Masculino
            <input type="radio" name="sexo" id="inFeminino" required> Feminino
        </p>
        <p>
            Altura:
            <input type="number" id="inAltura" min="0" step="0.01" required>
        </p>
        <p>
            <input type="submit" value="Calcular Peso ideal">
            <input type="reset" value="Limpar dados">
        </p>
    </form>

    <pre></pre>
    
    <script src="js/ex4_2b.js"></script>
</body>
</html>
