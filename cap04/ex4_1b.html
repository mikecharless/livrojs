<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Aprovação do aluno</h1>
    </header>
    <main>
        <form>
            <p>Nome do aluno:
               <input type="text" id="inNome" required autofocus> 
            </p>
            <p>
                1° Nota do aluno:
                <input type="number" id="inNota1" required min="0" max="10" step="0.1">
            </p>
            <p>
                2° Nota do aluno:
                <input type="number" id="inNota2" required min="0" max="10" step="0.1">
            </p>
            <p>
                <input type="submit" value="Exibir média e situação do aluno" id="button">
            </p>
        </form>

        <pre id="outResp1"></pre>
        <pre id="outResp2"></pre>
    </main>

    <script src="js/ex4_1b.js"></script>
    
</body>
</html>
