<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultório Odontológico</title>
    <link rel="shortcut icon" href="img/Medicalwp-Medical-Tooth-blue.256 (1).png" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div>
        <header>
            <img src="img/consultorio_odonto.jpeg" alt="consultório odonto">
            <h1>Consultório Odontológico</h1>
        </header>
        <main>
            <form>
                <p>
                    <label for="inPaciente">Paciente: </label>
                    <input type="text" id="inPaciente" required autofocus>
                    <input type="submit" value="Adicionar" class="butao">
                    <input type="button" value="Urgência" class="butao" id="btUrgencia">
                    <input type="button" value="Atender" class="butao" id="btAtender">
                </p>
            </form>
            <pre>Em atendimento: <span class="fonte-azul"></span>
            </pre>
            <pre id="outResp"></pre>
        </main>
    </div>

    <script src="js/ex6_1.js"></script>
</body>
</html>
