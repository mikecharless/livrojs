<meta charset="UTF-8">

<script>
    /*O método prompot reotrna sempre uma string. Portanto, o método Number fará a conversão da saída 
    para um valor to tipo número */
    const num = Number(prompt("Digite um número:"))

    const dobro = num*2

    alert("O dobro de " + num + " é " + dobro)
</script>
