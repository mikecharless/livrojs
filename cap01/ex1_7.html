<meta charset="UTF-8">

<script>
    const numDias = Number(prompt("N° de dias: "))
    const numHoras = Number(prompt("N° de horas: "))

    /*o uso de parenteses, ainda que não sendo obrigatório, facilita o entendimento da expressão matemática */
    const totalHoras = (numDias*24) + numHoras

    alert("Total de horas: " + totalHoras)
</script>
