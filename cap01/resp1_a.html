<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números vizinhos</title>
</head>
<body>
    <script>
        const num = Number(prompt("Número: "))

        const num1 = num - 1
        const num2 = num + 1

        alert("Vizinhos: " + num1 + " e " + num2)
    </script>
</body>
</html>
