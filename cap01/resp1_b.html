<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>valor dividido da pizzaria</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Programa conta da pizzaria</h1>

    <script>
        const valor = Number(prompt("Valor da conta R$: "))
        const numClientes = Number(prompt("Número de clientes: "))

        const valorCliente = valor/numClientes

        alert("Valor por cliente R$: " + valorCliente.toFixed(2))
    </script>

    <!--alteração no capítulo 1-->
</body>
</html>
